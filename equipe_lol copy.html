<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>League of Legends - Roulette de Tirage au Sort</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Friz+Quadrata+Std:wght@700&display=swap');

    body {
      font-family: 'Friz Quadrata Std', serif;
      text-align: center;
      background: radial-gradient(circle at center, #0b132b 0%, #1c2541 70%, #3a506b 100%);
      color: #f4e87c;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    h1 {
      color: #c6b63f;
      text-shadow: 0 0 10px #e3d26f;
      font-size: 2em;
      margin-bottom: 10px;
    }

    .players {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      width: 300px;
      margin: 15px 0;
    }

    input[type="text"] {
      padding: 8px;
      border-radius: 5px;
      border: 1px solid #c6b63f;
      background-color: #1c1c1c;
      color: #f4e87c;
      font-size: 15px;
      text-align: center;
    }

    button {
      background: linear-gradient(90deg, #c6b63f, #9b870c);
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      color: #0b132b;
      margin: 5px;
      transition: 0.3s;
      box-shadow: 0 0 10px #c6b63f;
    }

    button:hover {
      transform: scale(1.05);
      background: linear-gradient(90deg, #e3d26f, #c6b63f);
    }

    #rouletteCanvas {
      border: 5px solid #c6b63f;
      border-radius: 50%;
      margin-top: 15px;
      background: #0b132b;
      box-shadow: 0 0 30px #c6b63f88;
    }

    #winner {
      margin-top: 20px;
      font-size: 1.5em;
      font-weight: bold;
      text-shadow: 0 0 15px gold;
    }
  </style>
</head>
<body>
  <h1>⚔️ Roulette League of Legends ⚔️</h1>
  <p>Entrez vos invocateurs :</p>

  <div class="players" id="players">
    <input type="text" placeholder="Invocateur 1">
    <input type="text" placeholder="Invocateur 2">
    <input type="text" placeholder="Invocateur 3">
    <input type="text" placeholder="Invocateur 4">
    <input type="text" placeholder="Invocateur 5">
    <input type="text" placeholder="Invocateur 6">
    <input type="text" placeholder="Invocateur 7">
    <input type="text" placeholder="Invocateur 8">
  </div>

  <button onclick="creerRoulette()">🎨 Créer la roue</button>
  <canvas id="rouletteCanvas" width="400" height="400"></canvas>
  <br>
  <button id="spinButton" style="display:none" onclick="lancerRoulette()">🎲 Lancer la roue</button>
  <button id="removeButton" style="display:none" onclick="relancerSansGagnant()">🔁 Relancer sans le gagnant</button>
  <div id="winner"></div>

  <script>
    let joueurs = [];
    let dernierGagnant = null;
    const canvas = document.getElementById("rouletteCanvas");
    const ctx = canvas.getContext("2d");
    let startAngle = 0;
    let arc = 0;
    let spinAngleStart = 0;
    let spinTime = 0;
    let spinTimeTotal = 0;
    let spinTimeout = null;

    function creerRoulette() {
      const inputs = document.querySelectorAll("#players input");
      joueurs = Array.from(inputs).map(i => i.value.trim()).filter(n => n !== "");

      if (joueurs.length < 2) {
        alert("Veuillez entrer au moins deux invocateurs !");
        return;
      }

      arc = Math.PI * 2 / joueurs.length;
      dessinerRoulette();
      document.getElementById("spinButton").style.display = "inline-block";
      document.getElementById("removeButton").style.display = "none";
      document.getElementById("winner").textContent = "";
    }

    function dessinerRoulette() {
      ctx.clearRect(0, 0, 400, 400);
      for (let i = 0; i < joueurs.length; i++) {
        const angle = startAngle + i * arc;
        ctx.fillStyle = `hsl(${i * 360 / joueurs.length}, 500%, 40%)`;
        ctx.beginPath();
        ctx.moveTo(200, 200);
        ctx.arc(200, 200, 200, angle, angle + arc);
        ctx.fill();

        ctx.save();
        ctx.translate(200, 200);
        ctx.rotate(angle + arc / 2);
        ctx.fillStyle = "white";
        ctx.font = "bold 15px Friz Quadrata Std";
        ctx.textAlign = "right";
        ctx.fillText(joueurs[i], 180, 10);
        ctx.restore();
      }

      // Pointeur
      ctx.fillStyle = "#c6b63f";
      ctx.beginPath();
      ctx.moveTo(190, 0);
      ctx.lineTo(210, 0);
      ctx.lineTo(200, 25);
      ctx.fill();
    }

    function lancerRoulette() {
      spinAngleStart = Math.random() * 10 + 20;
      spinTime = 0;
      spinTimeTotal = Math.random() * 3000 + 9000;
      tourner();
    }

    function tourner() {
      spinTime += 30;
      if (spinTime >= spinTimeTotal) {
        arreter();
        return;
      }
      const spinAngle = spinAngleStart - easeOut(spinTime, 0, spinAngleStart, spinTimeTotal);
      startAngle += (spinAngle * Math.PI / 180);
      dessinerRoulette();
      spinTimeout = setTimeout(tourner, 30);
    }

    function arreter() {
      clearTimeout(spinTimeout);
      const degrees = startAngle * 180 / Math.PI + 90;
      const arcd = arc * 180 / Math.PI;
      const index = Math.floor((360 - (degrees % 360)) / arcd) % joueurs.length;
      const gagnant = joueurs[index];
      dernierGagnant = gagnant;
      document.getElementById("winner").textContent = "🏆 Gagnant : " + gagnant + " 🎉";
      document.getElementById("removeButton").style.display = "inline-block";
    }

    function relancerSansGagnant() {
      if (!dernierGagnant) return alert("Aucun gagnant précédent !");
      joueurs = joueurs.filter(j => j !== dernierGagnant);
      if (joueurs.length < 2) {
        alert("Il ne reste pas assez de joueurs pour relancer la roue !");
        return;
      }
      arc = Math.PI * 2 / joueurs.length;
      startAngle = 0;
      dessinerRoulette();
      document.getElementById("winner").textContent = "";
      document.getElementById("removeButton").style.display = "none";
    }

    function easeOut(t, b, c, d) {
      const ts = (t /= d) * t;
      const tc = ts * t;
      return b + c * (tc + -3 * ts + 3 * t);
    }
  </script>
</body>
</html>
