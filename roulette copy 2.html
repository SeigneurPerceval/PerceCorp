<canvas id="wheel" width="400" height="400"></canvas>
<div style="text-align:center; margin-top:10px;">
  <button id="spin">🎰 Tourner</button>
  <h2 id="result"></h2>
</div>

<script>
const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const resultEl = document.getElementById("result");

const items = ["🍎 Pomme", "🍌 Banane", "🍒 Cerise", "🍇 Raisin", "🍉 Pastèque", "🍋 Citron"];
const numItems = items.length;
const sliceAngle = (2 * Math.PI) / numItems;
const center = canvas.width / 2;
const radius = 160;

let rotation = 0;
let spinning = false;

// 🎨 Fonction de dessin de la roue
function drawWheel() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(center, center);
  ctx.rotate(rotation);

  for (let i = 0; i < numItems; i++) {
    const start = i * sliceAngle;
    const end = start + sliceAngle;

    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, radius, start, end);
    ctx.fillStyle = i % 2 === 0 ? "#fbc02d" : "#ff7043";
    ctx.fill();
    ctx.stroke();

    // Texte centré dans le secteur
    ctx.save();
    ctx.rotate(start + sliceAngle / 2);
    ctx.textAlign = "right";
    ctx.fillStyle = "#000";
    ctx.font = "16px sans-serif";
    ctx.fillText(items[i], radius - 10, 5);
    ctx.restore();
  }

  ctx.restore();

  // 🔻 Pointeur fixe (triangle rouge)
  ctx.beginPath();
  ctx.moveTo(center, center - radius - 10);
  ctx.lineTo(center - 10, center - radius - 30);
  ctx.lineTo(center + 10, center - radius - 30);
  ctx.fillStyle = "red";
  ctx.fill();
}

// 🎯 Trouver quel élément est sous le pointeur
function getWinningIndex() {
  const normalized = (2 * Math.PI - (rotation % (2 * Math.PI))) % (2 * Math.PI);
  return Math.floor(normalized / sliceAngle) % numItems;
}

// ⚙️ Animation de rotation
function spinWheel() {
  if (spinning) return;
  spinning = true;

  const extraSpins = 6; // tours complets
  const targetAngle = Math.random() * 2 * Math.PI + extraSpins * 2 * Math.PI;
  const duration = 4000; // 4 secondes
  const start = performance.now();
  const initialRotation = rotation;

  function animate(now) {
    const elapsed = now - start;
    const progress = Math.min(elapsed / duration, 1);
    const easeOut = 1 - Math.pow(1 - progress, 3); // effet décélération
    rotation = initialRotation + targetAngle * easeOut;
    drawWheel();

    if (progress < 1) {
      requestAnimationFrame(animate);
    } else {
      spinning = false;
      const winner = items[getWinningIndex()];
      resultEl.textContent = "🎉 Gagné : " + winner;
    }
  }

  requestAnimationFrame(animate);
}

drawWheel();
document.getElementById("spin").addEventListener("click", spinWheel);
</script>
